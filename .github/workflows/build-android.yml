name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      HOME: /github/home
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl unzip openjdk-17-jdk

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot export templates and debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -o /tmp/godot_templates.tpz
          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "Using Java SDK: $JAVA_HOME"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate and export Android APK
        shell: bash
        run: |
          mkdir -p build
          export PATH="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/VoxelWorld.apk --verbose
          test -s build/VoxelWorld.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Voxel-World-Android-APK
          path: build/VoxelWorld.apk
          if-no-files-found: error
          retention-days: 30
