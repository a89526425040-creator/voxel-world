name: Build Windows Prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Export Windows x86_64
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      HOME: /github/home
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install download tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl unzip

      - name: Install Godot export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -o /tmp/godot_templates.tpz
          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Validate and export project
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-release "Windows Desktop" build/VoxelWorld.exe
          test -s build/VoxelWorld.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Voxel-World-Windows
          path: build/VoxelWorld.exe
          if-no-files-found: error
          retention-days: 30
